name: Linux downloads and draft release

on:
  push:
    tags:
      # Catch the CLI prefix broadly; validation rejects malformed stable tags.
      - 'paircomp-v**'
  workflow_dispatch:

# Dispatch builds never receive release-write permission.
permissions:
  contents: read

concurrency:
  group: paircomp-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
    steps:
      # Define each action pin on its first use; aliases keep later steps in sync.
      - uses: &checkout actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Lint release shell scripts
        run: |
          shellcheck --version
          shellcheck -x scripts/release/*.sh
      - name: Test release validation and recovery
        run: python3 -m unittest discover -s scripts/release/tests -v
      - name: Validate stable release source
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          python3 scripts/release/validate.py --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"
      - name: Record selected commit and CLI version
        id: source
        run: python3 scripts/release/validate.py --commit "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"

  build:
    needs: validate
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [gnu, musl]
    steps:
      - uses: *checkout
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - name: Record runner and rootless Podman
        run: |
          {
            printf 'Runner image: %s %s\n\n' "$ImageOS" "$ImageVersion"
            cat /etc/os-release
            uname -sr
            podman --version
            podman info --format 'Rootless: {{.Host.Security.Rootless}}'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$(id -u)" != 0
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
      - name: Build, test, package, and exercise download
        env:
          BUILD_TARGET: ${{ matrix.target }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: bash scripts/release/build.sh "$BUILD_TARGET" "$SOURCE_COMMIT" dist
      - uses: &upload_artifact actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paircomp-linux-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
          # Rerun build jobs may replace Actions artifacts, never release assets.
          overwrite: true

  bundle:
    needs: [validate, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.downloads.outputs.artifact-id }}
    steps:
      - uses: *checkout
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: &download_artifact actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: paircomp-linux-gnu
          path: dist
      - uses: *download_artifact
        with:
          name: paircomp-linux-musl
          path: dist
      - name: Verify both archives and create SHA256SUMS
        env:
          SOURCE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: python3 scripts/release/artifacts.py --commit "$SOURCE_COMMIT" --write-checksums dist
      - uses: *upload_artifact
        id: downloads
        with:
          name: paircomp-linux-downloads
          path: dist/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  draft:
    if: github.event_name == 'push'
    needs: [validate, bundle]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: *checkout
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: *download_artifact
        with:
          artifact-ids: ${{ needs.bundle.outputs.artifact_id }}
          merge-multiple: true
          path: dist
      - name: Recheck remote main and prepare unpublished draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          python3 scripts/release/draft.py --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT" --artifacts dist
