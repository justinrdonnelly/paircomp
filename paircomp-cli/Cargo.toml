[package]
name = "paircomp"
description = "Command-line interface for Paircomp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"

[[bin]]
name = "paircomp"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
paircomp-core = { path = "../paircomp-core", version = "0.1.0" }
