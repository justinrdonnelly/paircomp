[package]
name = "paircomp-cli"
description = "Command-line interface for Paircomp"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "paircomp"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
paircomp-core = { path = "../paircomp-core" }
